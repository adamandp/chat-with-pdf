# Isolated disposable dependencies; never points at the application's database.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag_test
      POSTGRES_PASSWORD: rag_test_only
      POSTGRES_DB: rag_test
    ports: ['127.0.0.1:15432:5432']
    tmpfs: [/var/lib/postgresql/data]
  minio:
    image: ${MINIO_TEST_IMAGE:-chat-pdf-minio:local}
    command: server /data
    environment:
      MINIO_ROOT_USER: rag-test
      MINIO_ROOT_PASSWORD: rag-test-only-password
    ports: ['127.0.0.1:19000:9000']
    tmpfs: [/data]
