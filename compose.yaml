name: chat-pdf

x-app-env: &app-env
  DATABASE_URL: postgresql://chat_pdf:local_database_password@postgres:5432/chat_pdf?schema=public
  ACCESS_JWT_SECRET: ${ACCESS_JWT_SECRET:-local-access-secret-change-before-production}
  REFRESH_JWT_SECRET: ${REFRESH_JWT_SECRET:-local-refresh-secret-change-before-production}
  FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3001}
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REDIS_USERNAME: default
  REDIS_PASSWORD: local_redis_password
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: local-minio
  MINIO_SECRET_KEY: local-minio-password
  MINIO_BUCKET: documents
  MINIO_SECURE: 'false'
  MILVUS_ADDRESS: milvus:19530
  MILVUS_SSL: 'false'
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_CHAT_MODEL: ${GROQ_CHAT_MODEL:-llama-3.3-70b-versatile}

services:
  api:
    build:
      context: .
      target: runtime
    init: true
    environment: *app-env
    ports: ['127.0.0.1:${API_PORT:-3000}:3000']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/auth/profile').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  migrate:
    build:
      context: .
      target: migrate
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat_pdf
      POSTGRES_PASSWORD: local_database_password
      POSTGRES_DB: chat_pdf
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chat_pdf -d chat_pdf']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass local_redis_password --maxmemory-policy noeviction --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'local_redis_password', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: kotsadm/minio:RELEASE.2025-09-07T16-13-09Z
    platform: linux/amd64
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: local-minio
      MINIO_ROOT_PASSWORD: local-minio-password
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 30

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command: etcd --advertise-client-urls=http://etcd:2379 --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    volumes: [etcd-data:/etcd]
    healthcheck:
      test: ['CMD', 'etcdctl', 'endpoint', 'health']
      interval: 5s
      timeout: 5s
      retries: 20

  milvus:
    image: milvusdb/milvus:v2.5.10
    command: ['milvus', 'run', 'standalone']
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: local-minio
      MINIO_SECRET_ACCESS_KEY: local-minio-password
    volumes: [milvus-data:/var/lib/milvus]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9091/healthz']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  minio-data:
  etcd-data:
  milvus-data:
